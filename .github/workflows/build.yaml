name: Build Android (No Impeller)

on:
  workflow_dispatch: # 这行代码就是召唤“手动运行按钮”的魔法

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 🌟 关键修改 1：直接拉取上游原作者的最新代码，而不是你 Fork 的旧代码
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: 'Lingyan000/fluxdo' 
          ref: 'main' 
          submodules: recursive
          # 👇 新增下面这两行：拉取完整的 Git 历史和标签
          fetch-depth: 0 
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # ✅ 动态获取最新的稳定版 Flutter (包含了最新的 Dart SDK)
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android NDK & Rust Targets
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Android NDK Environment
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653'

      # 🌟 关键修改 2：在编译前，用脚本自动修改 AndroidManifest.xml 插入关闭 Impeller 的配置
      - name: Disable Impeller (Auto Patch AndroidManifest)
        run: |
          # 无论代码怎么变，我们固定在 </application> 标签前插入关闭 Impeller 的配置
          sed -i 's|</application>|    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>|' android/app/src/main/AndroidManifest.xml
          
          # 打印一下检查是否插入成功
          echo "✅ 成功修改 AndroidManifest.xml，检查如下："
          grep "EnableImpeller" android/app/src/main/AndroidManifest.xml

      - name: Generate Dummy Keystore (解决小白没有原作者签名的报错问题)
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=fluxdo, OU=fluxdo, O=fluxdo, L=Unknown, ST=Unknown, C=Unknown" -storepass 123456 -keypass 123456
          echo "storePassword=123456" > android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Compile APK
        run: |
          dart tool/flutterw.dart build apk --release --target-platform android-arm64 --dart-define=cronetHttpNoPlay=true
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk dist/fluxdo-arm64-no-impeller.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-android-apk
          path: ./dist
          overwrite: true
